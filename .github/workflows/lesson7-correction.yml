name: Apply and validate Lesson 7 correction
on:
  push:
    branches: [fix/lesson-7-central-approval]
    paths: [scripts/correct-lesson7-approval.mjs, .github/workflows/lesson7-correction.yml]
permissions:
  contents: write
concurrency:
  group: lesson7-correction
  cancel-in-progress: false
jobs:
  correct-lesson:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lesson-7-central-approval
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply version-checked lesson correction
        run: node scripts/correct-lesson7-approval.mjs
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Commit only the corrected simulator to the safety branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/director-lesson7-simulator.tsx
          git commit -m 'Correct Lesson 7 to use central Director customer-credit approval'
          git push origin HEAD:fix/lesson-7-central-approval
